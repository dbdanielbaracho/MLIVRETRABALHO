name: Web lockfile bootstrap

on:
  push:
    branches:
      - feat/web-enterprise-baseline
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-enterprise-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Resolve web dependencies and update lockfile
        run: pnpm install --lockfile-only
      - name: Commit reproducible lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore(web): generate reproducible lockfile"
          git push

name: Project Activity Watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/project-activity-watch.yml'
      - 'scripts/tests/project-activity-watch.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-activity-watch.yml'
      - 'scripts/tests/project-activity-watch.test.mjs'
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: project-activity-watch
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check project activity and publish a factual summary
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const now=Date.now(),threshold=15*60*1000;
            const [commit,prs,runs,issues]=await Promise.all([
              github.rest.repos.getCommit({owner,repo,ref:'main'}),
              github.rest.pulls.list({owner,repo,state:'open',per_page:100}),
              github.rest.actions.listWorkflowRunsForRepo({owner,repo,per_page:100}),
              github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100})
            ]);
            const time=commit.data.commit.committer?.date ?? commit.data.commit.author?.date;
            const age=now-new Date(time).getTime();
            const active=runs.data.workflow_runs.filter(r=>r.id!==context.runId && ['queued','in_progress','waiting','pending','requested'].includes(r.status));
            const state=active.length?'CI/ACTIONS EM EXECUÇÃO':age>threshold?'SEM NOVO COMMIT (>15 MIN)':'COMMIT RECENTE (<15 MIN)';
            const sha=commit.data.sha;
            const lines=[
              '# MLivreTrabalho — painel de atividade',
              '',
              '- Atualizado (UTC): '+new Date(now).toISOString(),
              '- Estado observado: **'+state+'**',
              '- Último commit na main: `'+sha+'`',
              '- Horário do commit (UTC): '+time,
              '- Minutos desde o commit: '+Math.max(0,Math.floor(age/60000)),
              '- PRs abertos: '+prs.data.length,
              '- GitHub Actions ativos: '+active.length,
              '- Runs: '+active.slice(0,6).map(r=>r.name+' ('+r.status+')').join('; '),
              '',
              '**Importante:** GitHub Actions ativo não comprova que um agente esteja programando. Ausência de commit também não prova ausência de trabalho. Este painel mostra somente sinais verificáveis do GitHub; não monitora o processo do ChatGPT. O agendamento de 15 minutos é aproximado e pode atrasar.'
            ];
            await core.summary.addRaw(lines.join('\n')).write();
            core.info('ACTIVITY_WATCH_OBSERVED '+JSON.stringify({sha,state,ageMinutes:Math.max(0,Math.floor(age/60000)),openPrs:prs.data.length,activeRuns:active.length,event:context.eventName}));
            if(context.eventName==='pull_request'){
              core.info('ACTIVITY_WATCH_PREVIEW no_issue_writes=true');
              return;
            }
            const title='[Activity Watch] Sem commit por mais de 15 minutos';
            const existing=issues.find(i=>!i.pull_request && i.title===title);
            if(age>threshold && !existing){
              await github.rest.issues.create({owner,repo,title,body:lines.join('\n')+'\n\nO aviso é sobre ausência de commits, não um diagnóstico definitivo de agente parado.'});
            } else if(age<=threshold && existing){
              await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body:'Novo commit detectado em '+new Date(now).toISOString()+': `'+sha+'`. Encerrando o alerta de ausência de commits.'});
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }

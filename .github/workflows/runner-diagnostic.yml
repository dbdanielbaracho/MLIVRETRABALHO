name: Runner Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Prove runner allocation
        run: |
          echo "runner=${RUNNER_NAME}"
          uname -a

  ubuntu-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner allocation
        run: |
          echo "runner=${RUNNER_NAME}"
          uname -a

  ubuntu-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove slim runner allocation
        run: |
          echo "runner=${RUNNER_NAME}"
          uname -a

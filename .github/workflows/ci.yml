name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlivretrabalho
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mlivretrabalho"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run tests
        run: pnpm test

      - name: Verify production migration runner
        env:
          PGPASSWORD: postgres
          MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_migrations
        run: |
          createdb -h localhost -U postgres mlivretrabalho_migrations
          DATABASE_URL="$MIGRATION_TEST_URL" pnpm --filter @mlivretrabalho/api migrate
          DATABASE_URL="$MIGRATION_TEST_URL" pnpm --filter @mlivretrabalho/api migrate
          EXPECTED="$(find packages/db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          APPLIED="$(psql "$MIGRATION_TEST_URL" -tAc 'SELECT count(*) FROM schema_migrations' | tr -d ' ')"
          test "$APPLIED" = "$EXPECTED"

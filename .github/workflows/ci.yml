name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlivretrabalho
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mlivretrabalho"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Export mobile Android bundle
        env:
          CI: '1'
        run: |
          pnpm --filter @mlivretrabalho/mobile export:android
          test -d apps/mobile/dist
          find apps/mobile/dist -type f | grep -q .

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run tests
        run: pnpm test

      - name: Verify production migration runner
        env:
          PGPASSWORD: postgres
          MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_migrations
        run: |
          createdb -h localhost -U postgres mlivretrabalho_migrations
          DATABASE_URL="$MIGRATION_TEST_URL" pnpm --filter @mlivretrabalho/api migrate
          DATABASE_URL="$MIGRATION_TEST_URL" pnpm --filter @mlivretrabalho/api migrate
          EXPECTED="$(find packages/db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          APPLIED="$(psql "$MIGRATION_TEST_URL" -tAc 'SELECT count(*) FROM schema_migrations' | tr -d ' ')"
          test "$APPLIED" = "$EXPECTED"

      - name: HTTP journey, readiness and Production Truth contract
        env:
          PGPASSWORD: postgres
          HTTP_TEST_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_http
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
        run: |
          createdb -h localhost -U postgres mlivretrabalho_http
          DATABASE_URL="$HTTP_TEST_URL" pnpm --filter @mlivretrabalho/api migrate
          DATABASE_URL="$HTTP_TEST_URL" pnpm --filter @mlivretrabalho/api start > /tmp/mlivre-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/v1/health/ready >/dev/null; then break; fi
            sleep 0.5
          done
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-company-onboarding-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 DATABASE_URL="$HTTP_TEST_URL" bash scripts/http-journey-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-recommendations-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-notifications-multi-company-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-replacement-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-team-allocation-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-planner-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-safety-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-safety-appeals-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-trust-causality-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-ratings-reputation-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-finance-reconciliation-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-copilot-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/http-privacy-export-e2e.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-api.sh || { cat /tmp/mlivre-api.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 EXPECTED_VERSION=0.1.0 bash scripts/production-truth-gate.sh || { cat /tmp/mlivre-api.log; exit 1; }

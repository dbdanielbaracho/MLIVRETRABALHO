name: Standalone Pilot APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-standalone-pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test standalone smoke gate and failure diagnostics
        run: node --test scripts/tests/android-standalone-smoke.test.mjs
      - name: Build standalone APK
        env:
          EXPO_PUBLIC_API_URL: https://mlivretrabalho.predibeacon.com/v1
        run: bash scripts/build-android-pilot.sh

      # Do not publish an APK merely because Gradle compiled it. Boot a clean
      # Android emulator, install the exact artifact, launch it with Metro absent,
      # and fail on native/React Native fatal crashes.
      - name: Release canonical build-only Gradle daemons before emulator boot
        run: |
          free -m
          ps -eo comm,rss | awk '$1 == "java" {sum += $2} END {print "CANONICAL_JAVA_RSS_KIB_BEFORE", sum+0}'
          (cd apps/mobile/android && ./gradlew --stop)
          free -m
          ps -eo comm,rss | awk '$1 == "java" {sum += $2} END {print "CANONICAL_JAVA_RSS_KIB_AFTER", sum+0}'

      - name: Checkout the pinned Android emulator runner source
        uses: actions/checkout@v4
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: .github/tools/android-emulator-runner
          persist-credentials: false
      - name: Use the pinned runner Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Device smoke test — install and launch without Metro
        id: device_smoke
        env:
          INPUT_API-LEVEL: '35'
          INPUT_SYSTEM-IMAGE-API-LEVEL: '35'
          INPUT_TARGET: default
          INPUT_ARCH: x86_64
          INPUT_PROFILE: pixel_6
          INPUT_CORES: '2'
          INPUT_RAM-SIZE: ''
          INPUT_HEAP-SIZE: ''
          INPUT_SDCARD-PATH-OR-SIZE: ''
          INPUT_DISK-SIZE: ''
          INPUT_AVD-NAME: test
          INPUT_FORCE-AVD-CREATION: 'true'
          INPUT_EMULATOR-BOOT-TIMEOUT: '1200'
          INPUT_EMULATOR-PORT: '5554'
          INPUT_EMULATOR-OPTIONS: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save'
          INPUT_DISABLE-ANIMATIONS: 'false'
          INPUT_DISABLE-SPELLCHECKER: 'false'
          INPUT_DISABLE-LINUX-HW-ACCEL: 'true'
          INPUT_ENABLE-HW-KEYBOARD: 'false'
          INPUT_EMULATOR-BUILD: ''
          INPUT_WORKING-DIRECTORY: ''
          INPUT_NDK: ''
          INPUT_CMAKE: ''
          INPUT_CHANNEL: stable
          INPUT_SCRIPT: 'bash scripts/android-standalone-smoke.sh'
        run: node scripts/android-emulator-adb-readiness.cjs canonical

      - name: Collect early smoke failure diagnostics
        if: ${{ failure() && steps.device_smoke.outcome == 'failure' }}
        run: bash scripts/android-standalone-smoke.sh --diagnostics-only
      - name: Upload crash log on failure
        if: ${{ failure() && steps.device_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-device-smoke-logs
          path: |
            /tmp/mlivretrabalho-logcat.txt
            /tmp/mlivretrabalho-smoke-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-standalone-apk
          path: artifacts/android-pilot/
          if-no-files-found: error
          retention-days: 14

  native-support-fixture:
    needs: build-standalone-pilot-apk
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      support-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlivretrabalho_http
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mlivretrabalho_http"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the validated canonical APK from the preceding job
        uses: actions/download-artifact@v4
        with:
          name: MLivreTrabalho-standalone-apk
          path: artifacts/android-pilot
      - name: Prepare local API for isolated native support journey
        env:
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_http
        run: |
          node --test scripts/tests/platform-support-native-fixture.test.mjs
          node --test scripts/tests/platform-support-native-install.test.mjs
          pnpm --filter @mlivretrabalho/api build
          pnpm --filter @mlivretrabalho/api migrate
          node scripts/platform-support-native-api.cjs > /tmp/mlivre-support-native-api.log 2>&1 &
          echo $! > /tmp/mlivre-support-native-api.pid
          for i in $(seq 1 60); do
            if test -f /tmp/mlivre-support-native/public.json; then break; fi
            sleep 1
          done
          test -f /tmp/mlivre-support-native/public.json || { cat /tmp/mlivre-support-native-api.log; exit 1; }

      - name: Build separate local-only support fixture APK
        run: bash scripts/build-platform-support-native-fixture.sh

      # The native fixture builds a separate APK with Gradle. Release build-only
      # daemons before starting the software emulator, matching the canonical job.
      # This does not reset the AVD, change isolation, or weaken install checks.
      - name: Release native fixture build-only Gradle daemons before emulator boot
        run: |
          free -m
          ps -eo comm,rss | awk '$1 == "java" {sum += $2} END {print "NATIVE_JAVA_RSS_KIB_BEFORE", sum+0}'
          (cd apps/mobile/android && ./gradlew --stop)
          free -m
          ps -eo comm,rss | awk '$1 == "java" {sum += $2} END {print "NATIVE_JAVA_RSS_KIB_AFTER", sum+0}'

      - name: Prepare action-owned empty AVD namespace
        run: |
          avd_root="$HOME/.android/avd"
          if test -e "$avd_root"; then
            test -d "$avd_root"
            test -z "$(find "$avd_root" -mindepth 1 -maxdepth 1 -print -quit)"
          else
            mkdir -p "$avd_root"
          fi
          printf 'ANDROID_AVD_HOME=%s\n' "$avd_root" >> "$GITHUB_ENV"
          echo "NATIVE_AVD_HOME_READY $avd_root"

      - name: Require a fresh isolated AVD namespace and four host CPUs
        run: |
          avd_root="${ANDROID_AVD_HOME:?ANDROID_AVD_HOME must be set}"
          test "$avd_root" = "$HOME/.android/avd"
          test -d "$avd_root"
          test -z "$(find "$avd_root" -mindepth 1 -maxdepth 1 -print -quit)"
          test ! -e "$avd_root/platform-support-fixture.avd"
          test ! -e "$avd_root/platform-support-fixture.ini"
          available_cpus="$(nproc)"
          echo "NATIVE_HOST_CPUS $available_cpus"
          test "$available_cpus" -ge 4

      - name: Checkout the pinned Android emulator runner source
        uses: actions/checkout@v4
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: .github/tools/android-emulator-runner
          persist-credentials: false
      - name: Use the pinned runner Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render native support states and recovery with real local sessions
        id: native_support_fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_http
          INPUT_API-LEVEL: '35'
          INPUT_SYSTEM-IMAGE-API-LEVEL: '35'
          INPUT_TARGET: default
          INPUT_ARCH: x86_64
          INPUT_PROFILE: pixel_6
          INPUT_CORES: '2'
          INPUT_RAM-SIZE: ''
          INPUT_HEAP-SIZE: ''
          INPUT_SDCARD-PATH-OR-SIZE: ''
          INPUT_DISK-SIZE: ''
          INPUT_AVD-NAME: test
          INPUT_FORCE-AVD-CREATION: 'true'
          INPUT_EMULATOR-BOOT-TIMEOUT: '1200'
          INPUT_EMULATOR-PORT: '5554'
          INPUT_EMULATOR-OPTIONS: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save'
          INPUT_DISABLE-ANIMATIONS: 'false'
          INPUT_DISABLE-SPELLCHECKER: 'false'
          INPUT_DISABLE-LINUX-HW-ACCEL: 'true'
          INPUT_ENABLE-HW-KEYBOARD: 'false'
          INPUT_EMULATOR-BUILD: ''
          INPUT_WORKING-DIRECTORY: ''
          INPUT_NDK: ''
          INPUT_CMAKE: ''
          INPUT_CHANNEL: stable
          INPUT_SCRIPT: 'bash scripts/run-platform-support-native-fixture.sh'
        run: node scripts/android-emulator-adb-readiness.cjs native

      - name: Close local fixture and verify cleanup
        if: always()
        run: |
          if test -f /tmp/mlivre-support-native-api.pid; then
            kill -TERM "$(cat /tmp/mlivre-support-native-api.pid)"
            for i in $(seq 1 30); do
              if grep -Fq NATIVE_API_CLEANUP_PASS /tmp/mlivre-support-native-api.log; then break; fi
              sleep 1
            done
            grep -F NATIVE_API_CLEANUP_PASS /tmp/mlivre-support-native-api.log
          fi

      - name: Upload isolated native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-support-native-fixture
          path: |
            artifacts/platform-support-native/
            /tmp/mlivre-support-native-api.log
          if-no-files-found: warn
          retention-days: 14


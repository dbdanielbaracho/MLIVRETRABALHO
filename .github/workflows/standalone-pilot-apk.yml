name: Standalone Pilot APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-standalone-pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      support-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlivretrabalho_http
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mlivretrabalho_http"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test standalone smoke gate and failure diagnostics
        run: node --test scripts/tests/android-standalone-smoke.test.mjs
      - name: Build standalone APK
        env:
          EXPO_PUBLIC_API_URL: https://mlivretrabalho.predibeacon.com/v1
        run: bash scripts/build-android-pilot.sh

      # Do not publish an APK merely because Gradle compiled it. Boot a clean
      # Android emulator, install the exact artifact, launch it with Metro absent,
      # and fail on native/React Native fatal crashes.
      - name: Enable and verify KVM for the Android emulator
        run: |
          test -c /dev/kvm
          # Apply the same access mode directly to the existing ephemeral device;
          # don't depend on asynchronous udev events or a daemon reload.
          sudo chmod a+rw /dev/kvm
          stat -c 'KVM_PERMISSIONS %a %U %G' /dev/kvm
          test -r /dev/kvm || { echo 'KVM_NOT_READABLE'; exit 1; }
          test -w /dev/kvm || { echo 'KVM_NOT_WRITABLE'; exit 1; }
          echo "KVM_READY device=/dev/kvm"

      - name: Device smoke test — install and launch without Metro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          script: bash scripts/android-standalone-smoke.sh

      - name: Collect early smoke failure diagnostics
        if: failure()
        run: bash scripts/android-standalone-smoke.sh --diagnostics-only
      - name: Upload crash log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-device-smoke-logs
          path: |
            /tmp/mlivretrabalho-logcat.txt
            /tmp/mlivretrabalho-smoke-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-standalone-apk
          path: artifacts/android-pilot/
          if-no-files-found: error
          retention-days: 14

      # A second package/checkout/API/output, after preserving the canonical APK.
      # Reuse the already verified KVM setup; no new root, grants or permission fallback.
      - name: Prepare local API for isolated native support journey
        env:
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_http
        run: |
          pnpm --filter @mlivretrabalho/api build
          pnpm --filter @mlivretrabalho/api migrate
          node scripts/platform-support-native-api.cjs > /tmp/mlivre-support-native-api.log 2>&1 &
          echo $! > /tmp/mlivre-support-native-api.pid
          for i in $(seq 1 60); do
            if test -f /tmp/mlivre-support-native/public.json; then break; fi
            sleep 1
          done
          test -f /tmp/mlivre-support-native/public.json || { cat /tmp/mlivre-support-native-api.log; exit 1; }

      - name: Build separate local-only support fixture APK
        run: bash scripts/build-platform-support-native-fixture.sh

      - name: Render native support states and recovery with real local sessions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlivretrabalho_http
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save -wipe-data
          script: python3 scripts/platform-support-native-ui.py

      - name: Close local fixture and verify cleanup
        if: always()
        run: |
          if test -f /tmp/mlivre-support-native-api.pid; then
            kill -TERM "$(cat /tmp/mlivre-support-native-api.pid)"
            for i in $(seq 1 30); do
              if grep -Fq NATIVE_API_CLEANUP_PASS /tmp/mlivre-support-native-api.log; then break; fi
              sleep 1
            done
            grep -F NATIVE_API_CLEANUP_PASS /tmp/mlivre-support-native-api.log
          fi

      - name: Upload isolated native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-support-native-fixture
          path: |
            artifacts/platform-support-native/
            /tmp/mlivre-support-native-api.log
          if-no-files-found: warn
          retention-days: 14


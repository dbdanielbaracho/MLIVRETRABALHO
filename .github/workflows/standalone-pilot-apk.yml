name: Standalone Pilot APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/build-android-pilot.sh'
      - 'scripts/android-standalone-smoke.sh'
      - 'scripts/tests/android-entry-journey.test.mjs'
      - 'scripts/tests/android-entry-isolation.test.mjs'
      - 'scripts/android-entry-journey.cjs'
      - 'scripts/android-qmp-isolation.cjs'
      - 'scripts/tests/android-qmp-isolation.test.mjs'
      - 'scripts/tests/android-standalone-smoke.test.mjs'
      - '.github/workflows/standalone-pilot-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'scripts/build-android-pilot.sh'
      - 'scripts/android-standalone-smoke.sh'
      - 'scripts/tests/android-entry-journey.test.mjs'
      - 'scripts/tests/android-entry-isolation.test.mjs'
      - 'scripts/android-entry-journey.cjs'
      - 'scripts/android-qmp-isolation.cjs'
      - 'scripts/tests/android-qmp-isolation.test.mjs'
      - 'scripts/tests/android-standalone-smoke.test.mjs'
      - '.github/workflows/standalone-pilot-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  build-standalone-pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test standalone smoke gate and failure diagnostics
        run: |
          node --test scripts/tests/android-standalone-smoke.test.mjs
          node --test scripts/tests/android-entry-journey.test.mjs
          node --test scripts/tests/android-entry-isolation.test.mjs
          node --test scripts/tests/android-qmp-isolation.test.mjs
      - name: Build standalone APK
        env:
          EXPO_PUBLIC_API_URL: https://mlivretrabalho.predibeacon.com/v1
        run: bash scripts/build-android-pilot.sh

      # Do not publish an APK merely because Gradle compiled it. Boot a clean
      # Android emulator, install the exact artifact, launch it with Metro absent,
      # and fail on native/React Native fatal crashes.
      - name: Enable and verify KVM for the Android emulator
        run: |
          test -c /dev/kvm
          # Apply the same access mode directly to the existing ephemeral device;
          # don't depend on asynchronous udev events or a daemon reload.
          sudo chmod a+rw /dev/kvm
          stat -c 'KVM_PERMISSIONS %a %U %G' /dev/kvm
          test -r /dev/kvm || { echo 'KVM_NOT_READABLE'; exit 1; }
          test -w /dev/kvm || { echo 'KVM_NOT_WRITABLE'; exit 1; }
          echo "KVM_READY device=/dev/kvm"

      - name: Prepare private monitor for this job's owned emulator
        run: node scripts/android-qmp-isolation.cjs prepare

      - name: Device smoke test — install and launch without Metro
        env:
          MLIVRE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save -qemu -qmp unix:${{ env.MLIVRE_QMP_SOCKET }},server,nowait
          script: |
            bash scripts/android-standalone-smoke.sh
            node scripts/android-entry-journey.cjs

      - name: Collect early smoke failure diagnostics
        if: failure()
        run: bash scripts/android-standalone-smoke.sh --diagnostics-only
      - name: Upload crash log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-device-smoke-logs
          path: |
            /tmp/mlivretrabalho-logcat.txt
            /tmp/mlivretrabalho-smoke-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native entry journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-android-entry-journey
          path: artifacts/android-entry-journey/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MLivreTrabalho-standalone-apk
          path: artifacts/android-pilot/
          if-no-files-found: error
          retention-days: 14

